name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: nothing here writes to the repo. Explicit so a change to
# the repository's default token permissions can't widen it.
permissions:
  contents: read

# A new push to a PR supersedes its running check. Runs on main are never
# cancelled, so every commit that lands keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Actions are pinned to full commit SHAs (a tag can be moved to other
    # code); the comment is the release the SHA belongs to.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Same npm as netlify.toml: npm 10 (bundled with Node 20) crashes
      # resolving vitest's optional peers; npm 11 does not.
      - name: Install npm 11
        run: npm install -g npm@11

      - run: npm ci

      - name: Unit and component tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Generate static build
        run: npm run generate

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser but not the OS libraries it links to.
      - name: Install system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
